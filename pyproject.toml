[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "respondent-lab"
version = "0.1.0"
description = "Mechanism-Invariant Distractor Generation MVP infrastructure"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.0",
  "pydantic>=2.0,<3.0",
  "PyYAML>=6.0",
  "sympy>=1.12",
  "pint>=0.22",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
